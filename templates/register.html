{% extends "base.html" %}{% block title %}Sign up &middot; InterviewPilot{% endblock %}
{% block content %}
<form method="post" class="card form narrow">
  <h1>Create your account</h1>
  <label>Name<input name="name" value="{{ name or '' }}" required minlength="2" maxlength="80" autocomplete="name"></label>
  <label>Email<input type="email" name="email" value="{{ email or '' }}" required autocomplete="email"></label>
  <label>Password (8+ characters)<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
  <button class="btn">Create account</button>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</form>
{% endblock %}
